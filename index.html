<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-round.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="César García is a software engineer in Calgary, from El Salvador, building full-stack web apps and cloud services." />
    <meta name="theme-color" content="#0b0d12" />
    <title>César García</title>
    <!-- Set the theme before first paint so there is no flash of the wrong palette. -->
    <script>
      (function () {
        var theme = "dark";
        try {
          theme = localStorage.getItem("vite-ui-theme") || "dark";
        } catch (e) {}
        if (theme === "system") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.classList.add(theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
