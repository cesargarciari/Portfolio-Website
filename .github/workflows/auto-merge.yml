name: Auto Merge AI PRs

on:
  pull_request_review:
    types: [submitted]

jobs:
  auto-merge:
    # Auto-merge only if:
    # • the branch starts with ai/
    # • the branch lives in this repo, not in a fork
    # • the review is an approval
    # • the approval comes from the repo owner
    if: |
      startsWith(github.event.pull_request.head.ref, 'ai/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.review.state == 'approved' &&
      github.event.review.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto merge on approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" --squash --repo "$GITHUB_REPOSITORY"